# site/ 를 GitHub Pages로 올린다.
#
# Pages의 "브랜치에서 배포"는 루트나 /docs 만 고를 수 있는데,
# 이 저장소의 docs/ 는 한국어 작업 문서라 홈페이지와 섞을 수 없다.
# 그래서 액션으로 site/ 만 따로 올린다.
name: 홈페이지 배포

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 취소하지 않고 끝나기를 기다린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

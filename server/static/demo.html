<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fitbalance — 개발용 미리보기</title>
<style>
  :root{
    --ink:#0C1112; --ink-2:#182124; --bg:#F2F5F4; --surface:#FFFFFF;
    --line:#E6EBEA; --text:#0C1112; --muted:#6B7A78; --muted-2:#98A6A4;
    --mint:#00D68F; --mint-deep:#00A874; --mint-soft:#DFF9EF;
    --coral:#FF6B5A; --coral-soft:#FFEDEA; --amber:#FFB020;
    --r-lg:22px; --r-md:16px; --r-sm:11px;
    --shadow:0 1px 2px rgba(12,17,18,.04), 0 8px 24px rgba(12,17,18,.06);
    --shadow-lift:0 2px 6px rgba(12,17,18,.06), 0 18px 40px rgba(12,17,18,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    background:
      radial-gradient(1000px 600px at 10% -10%, #E4F5EE 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #EAF0FF 0%, transparent 55%),
      var(--bg);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
                "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    line-height:1.5;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
  }
  .phone{
    max-width:412px;margin:0 auto;min-height:100vh;background:var(--bg);
    box-shadow:0 0 60px rgba(12,17,18,.10);position:relative;overflow-x:hidden;
  }
  .banner{
    background:rgba(12,17,18,.88);color:#B9C6C3;backdrop-filter:blur(8px);
    font-size:11px;padding:7px 20px;text-align:center;letter-spacing:0;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px 10px;position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--bg) 72%, transparent);
  }
  .brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;letter-spacing:-.045em}
  .brand .wm-a{color:var(--ink)}
  .brand .wm-b{color:var(--mint-deep)}
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg,var(--mint),var(--mint-deep));
    box-shadow:0 0 0 4px rgba(0,214,143,.16);
  }
  .icon-btn{
    width:36px;height:36px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);cursor:pointer;
    display:grid;place-items:center;transition:.16s;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--muted-2)}
  main{padding:4px 20px 40px;animation:rise .32s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  h2.title{font-size:26px;line-height:1.28;margin:6px 0 10px;font-weight:800;letter-spacing:-.035em}
  p.lead{color:var(--muted);font-size:14px;margin:0 0 22px}
  .eyebrow{
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--mint-deep);margin-bottom:6px;
  }
  .section-h{font-size:15px;font-weight:750;margin:26px 0 10px;letter-spacing:-.02em}

  .card{
    background:var(--surface);border-radius:var(--r-lg);padding:20px;
    box-shadow:var(--shadow);margin-bottom:12px;
  }
  .card.flat{box-shadow:none;border:1px solid var(--line)}

  /* 다크 히어로 */
  .hero{
    position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px;
    background:linear-gradient(150deg,#101A1B 0%,#0C1112 45%,#0F2420 100%);
    color:#fff;box-shadow:var(--shadow-lift);margin-bottom:14px;
  }
  .hero::before{
    content:"";position:absolute;width:230px;height:230px;right:-70px;top:-90px;
    background:radial-gradient(circle,rgba(0,214,143,.42),transparent 68%);
    filter:blur(6px);
  }
  .hero::after{
    content:"";position:absolute;width:180px;height:180px;left:-60px;bottom:-90px;
    background:radial-gradient(circle,rgba(96,165,250,.20),transparent 70%);
  }
  .hero > *{position:relative;z-index:1}
  .hero .label{font-size:11px;color:rgba(255,255,255,.52);font-weight:600;letter-spacing:.06em}
  .hero h3{margin:6px 0 0;font-size:23px;font-weight:800;letter-spacing:-.035em}
  .hero p{margin:8px 0 0;font-size:13px;color:rgba(255,255,255,.72);line-height:1.55}
  .hero .meta{
    margin-top:14px;display:inline-flex;gap:6px;align-items:center;
    font-size:11px;color:rgba(255,255,255,.6);
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);
    padding:5px 11px;border-radius:20px;
  }

  /* 점수 링 */
  .ring-wrap{display:flex;align-items:center;gap:18px}
  .ring-num{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .ring-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px}

  /* 레이더 */
  .radar-card{display:grid;place-items:center;padding:18px 20px 8px}

  /* 요인 막대 */
  .bar-row{margin:13px 0}
  .bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
  .bar-name{font-size:13.5px;font-weight:600}
  .bar-name .warn{
    display:inline-block;margin-left:5px;font-size:10px;font-weight:700;
    color:var(--coral);background:var(--coral-soft);padding:1px 6px;border-radius:6px;
    vertical-align:1px;letter-spacing:0;
  }
  .bar-val{font-size:12px;font-weight:700}
  .bar-bg{height:7px;background:#EDF1F0;border-radius:4px;overflow:hidden}
  .bar-fill{height:7px;border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}

  /* 항목 리스트 */
  .item-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:0}
  .item-name{font-size:14px;font-weight:600}
  .item-sub{font-size:12px;color:var(--muted-2);margin-top:2px}
  .item-rank{font-size:14px;font-weight:750;text-align:right}
  .item-grade{font-size:11px;margin-top:2px;font-weight:600}

  /* 폼 */
  .seg{display:flex;gap:6px;background:#EBEFEE;padding:4px;border-radius:14px;margin-top:8px}
  .seg button{
    flex:1;padding:10px;border:0;background:transparent;border-radius:10px;
    font-size:14px;font-weight:650;font-family:inherit;color:var(--muted);
    cursor:pointer;transition:.18s;
  }
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(12,17,18,.10)}
  .field{margin-top:14px}
  .field label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;
  }
  .field .unit{font-size:11px;color:var(--muted-2);font-weight:500}
  .field input{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;
    font-size:16px;font-weight:600;font-family:inherit;background:var(--surface);
    color:var(--text);transition:.16s;outline:none;
  }
  .field input:focus{border-color:var(--mint);box-shadow:0 0 0 4px rgba(0,214,143,.13)}
  .field input.bad{border-color:var(--coral)}
  .field input.bad:focus{box-shadow:0 0 0 4px rgba(255,107,90,.13)}
  .msg{font-size:11.5px;margin-top:5px;color:var(--muted-2)}
  .msg.err{color:var(--coral);font-weight:600}

  .progress{
    display:flex;align-items:center;gap:10px;margin:16px 0 4px;
    font-size:11.5px;color:var(--muted);font-weight:600;
  }
  .progress .track{flex:1;height:4px;background:#E6EBEA;border-radius:2px;overflow:hidden}
  .progress .fill{
    height:4px;border-radius:2px;transition:width .4s ease;
    background:linear-gradient(90deg,var(--mint),var(--mint-deep));
  }

  /* 버튼 */
  .btn{
    width:100%;padding:15px;border:0;border-radius:16px;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer;transition:.18s;letter-spacing:-.01em;
  }
  .btn.primary{
    color:#04120D;background:linear-gradient(135deg,#12F0A3,#00C283);
    box-shadow:0 6px 18px rgba(0,194,131,.30);
  }
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,194,131,.36)}
  .btn.primary:disabled{
    background:#DDE4E3;color:#9DABA9;box-shadow:none;cursor:not-allowed;transform:none;
  }
  .btn.dark{color:#fff;background:var(--ink)}
  .btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
  .btn.ghost:hover{color:var(--text);border-color:var(--muted-2)}
  .btn + .btn{margin-top:9px}
  .btn-stack{margin-top:22px}
  .link{
    background:none;border:0;color:var(--mint-deep);font-size:12.5px;font-weight:700;
    cursor:pointer;padding:4px 0;font-family:inherit;
  }

  /* 칩 */
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{
    font-size:12px;font-weight:650;padding:6px 12px;border-radius:20px;
    background:var(--mint-soft);color:var(--mint-deep);white-space:nowrap;
  }
  .chip.gray{background:#EDF1F0;color:var(--muted)}
  .chip.pick{cursor:pointer;transition:.16s;background:#EDF1F0;color:var(--muted)}
  .chip.pick:hover{background:#E1E8E6}
  .chip.pick.on{background:var(--ink);color:#fff}

  /* 강좌 카드 */
  .course{
    background:var(--surface);border-radius:var(--r-md);padding:16px;margin-bottom:10px;
    box-shadow:var(--shadow);cursor:pointer;transition:.2s;position:relative;overflow:hidden;
  }
  .course:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
  .course .rank{
    position:absolute;top:0;left:0;width:30px;height:26px;
    display:grid;place-items:center;font-size:11px;font-weight:800;
    color:#04120D;background:linear-gradient(135deg,#12F0A3,#00C283);
    border-radius:var(--r-md) 0 14px 0;
  }
  .course .rank.plain{background:#EDF1F0;color:var(--muted-2)}
  .course-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-left:24px}
  .course h3{margin:0;font-size:15.5px;font-weight:750;letter-spacing:-.025em}
  .course .score{font-size:17px;font-weight:800;color:var(--mint-deep);letter-spacing:-.03em;line-height:1}
  .course .score small{display:block;font-size:9.5px;color:var(--muted-2);font-weight:600;margin-top:2px}
  .course .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .course .when{
    font-size:12.5px;color:var(--text);margin-top:7px;font-weight:600;
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  }
  .course .when .sep{width:3px;height:3px;border-radius:50%;background:var(--muted-2)}
  .course .reason{
    font-size:11.5px;color:var(--mint-deep);margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--line);font-weight:600;
  }

  .kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:0}
  .kv .k{font-size:13px;color:var(--muted)}
  .kv .v{font-size:13px;font-weight:650}

  .empty{text-align:center;padding:44px 16px}
  .empty .emoji{font-size:34px;margin-bottom:10px}
  .empty strong{display:block;font-size:16px;margin-bottom:6px;letter-spacing:-.02em}
  .empty p{font-size:13px;color:var(--muted);margin:0 0 18px}

  /* 로딩: 마스코트가 분주하게 오르내린다 */
  .loading{text-align:center;padding:64px 16px}
  .loading .bob{display:inline-block;animation:bob .52s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-9px)}}
  .loading p{
    font-size:13.5px;color:var(--muted);font-weight:600;margin:10px 0 14px;
  }
  .loading .bar{
    width:120px;height:4px;margin:0 auto;border-radius:2px;
    background:#E6EBEA;overflow:hidden;position:relative;
  }
  .loading .bar::after{
    content:"";position:absolute;inset:0;width:45%;border-radius:2px;
    background:var(--mint-deep);animation:slide 1.1s ease-in-out infinite;
  }
  @keyframes slide{
    0%{transform:translateX(-100%)}100%{transform:translateX(240%)}
  }

  /* 지도 */
  .map-box{
    border-radius:var(--r-lg);background:#EFF4F2;overflow:hidden;margin-bottom:12px;
  }
  .map-box svg{display:block;width:100%;height:auto}
  .map-marker{cursor:pointer}
  .map-card{
    background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);
  }
  .map-card .top{display:flex;align-items:center;gap:10px}
  .map-card .rank{
    width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:12px;font-weight:800;color:#04120D;
    background:linear-gradient(135deg,#12F0A3,#00C283);
  }
  .map-card h3{margin:0;font-size:15.5px;font-weight:750;letter-spacing:-.025em}
  .map-card .addr{font-size:12.5px;color:var(--muted);margin-top:2px}
  .map-card .score{font-size:17px;font-weight:800;color:var(--mint-deep);margin-left:auto}
  .map-card .when{font-size:12.5px;font-weight:600;margin:10px 0 12px}

  /* 측정 입력 코치 */
  .coach{display:flex;align-items:center;gap:4px;margin-top:14px}
  .coach .bubble{
    flex:1;background:var(--surface);border-radius:4px 16px 16px 16px;
    padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--muted);
    box-shadow:var(--shadow);
  }
  .coach .bubble.done{background:var(--mint-soft);color:var(--mint-deep)}

  .skeleton{
    height:14px;border-radius:7px;margin:10px 0;
    background:linear-gradient(90deg,#EDF1F0 25%,#F6F9F8 50%,#EDF1F0 75%);
    background-size:200% 100%;animation:shim 1.3s infinite;
  }
  @keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

  .toast{
    background:var(--coral-soft);border:1px solid #FFD4CD;color:#B3392A;
    border-radius:14px;padding:13px 15px;font-size:12.5px;font-weight:600;margin-bottom:12px;
  }
  .range{
    -webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:#E3E9E8;outline:none;
  }
  .range::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:var(--surface);border:2.5px solid var(--mint-deep);cursor:pointer;
    box-shadow:0 2px 8px rgba(12,17,18,.18);
  }
  .mono{font-size:11px;color:var(--muted-2);word-break:break-all;line-height:1.6}
</style>
</head>
<body>
<div class="phone">
  <div class="banner">개발용 브라우저 미리보기 · 실제 배포물은 안드로이드 앱입니다</div>
  <header>
    <div class="brand"><span class="dot"></span><span class="wm-a">fit</span><span class="wm-b">balance</span></div>
    <button class="icon-btn" onclick="go('settings')" aria-label="설정">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>
  <main id="app"></main>
</div>

<script>
const API = "";
let deviceId = localStorage.getItem("device_id");
if (!deviceId) { deviceId = crypto.randomUUID(); localStorage.setItem("device_id", deviceId); }

const FACTOR_LABEL = {strength:"근력", endurance:"근지구력", flex:"유연성",
                      cardio:"심폐지구력", power:"순발력"};

// [이름, 위도, 경도, 주소]. 좌표는 계산용이고 화면에는 주소만 내보낸다.
const PRESETS = [
  ["시청·광화문", 37.5665, 126.9780, "서울특별시 중구 세종대로 일대"],
  ["강남역",      37.4979, 127.0276, "서울특별시 강남구 강남대로 일대"],
  ["여의도",      37.5219, 126.9245, "서울특별시 영등포구 여의도동 일대"],
  ["판교",        37.3947, 127.1112, "경기도 성남시 분당구 판교역로 일대"],
  ["홍대·마포",   37.5563, 126.9236, "서울특별시 마포구 양화로 일대"],
  ["잠실",        37.5133, 127.1000, "서울특별시 송파구 올림픽로 일대"],
  ["성수·왕십리", 37.5445, 127.0557, "서울특별시 성동구 왕십리로 일대"],
];

/** 좌표로 프리셋 주소를 찾는다. 못 찾으면 안내 문구를 돌려준다. */
function addressOf(lat, lng){
  const hit = PRESETS.find(([, la, ln]) =>
    Math.abs(la - lat) < 0.0005 && Math.abs(ln - lng) < 0.0005);
  return hit ? hit[3] : "선택한 지역 정보를 찾을 수 없습니다";
}

// 도구 없이 답할 수 있는 문항만 넣는다. 선택지 index가 그대로 0~3점이 된다.
const SELF_QUESTIONS = [
  {k:"strength",  factor:"근력",       q:"무릎 대고 팔굽혀펴기를 연속 몇 개나 할 수 있나요?",
   hint:"무릎을 바닥에 대고 해도 됩니다",
   options:["4개 이하","5~9개","10~19개","20개 이상"]},
  {k:"endurance", factor:"근지구력",   q:"의자에 앉았다 일어서기를 30초간 몇 번 하나요?",
   hint:"팔짱을 끼고, 등받이에 기대지 않고 세어 보세요",
   options:["9번 이하","10~14번","15~19번","20번 이상"]},
  {k:"flex",      factor:"유연성",     q:"선 자세에서 무릎을 펴고 앞으로 굽히면 손끝이 어디까지 닿나요?",
   hint:"반동 주지 말고 천천히 내려가 보세요",
   options:["무릎 위","무릎~정강이","발목 근처","손끝이 바닥에 닿음"]},
  {k:"cardio",    factor:"심폐지구력", q:"계단으로 3층까지 쉬지 않고 오르면 어떤가요?",
   hint:"평소 속도로 올랐을 때를 기준으로",
   options:["중간에 쉬어야 함","꽤 숨참","약간 숨참","거의 숨차지 않음"]},
  {k:"power",     factor:"순발력",     q:"계단을 두 칸씩 뛰어오를 수 있나요?",
   hint:"버스를 놓칠 것 같을 때를 떠올려 보세요",
   options:["못 함","힘듦","가능함","쉽게 함"]},
  {k:"activity",  factor:"활동량",     q:"일주일에 30분 이상 숨찬 운동을 며칠 하나요?",
   hint:"빠르게 걷기도 포함됩니다",

/**
 * 마스코트. 앱(Compose Canvas)과 같은 형태를 SVG로 그린다.
 * mood: happy | worried | proud | searching | workout
 */
function mascot(mood = "happy", size = 96, bodyColor = "var(--mint)"){
  const s = size, cx = s / 2;
  const bodyW = s * 0.62, bodyH = s * 0.70, bodyTop = s * 0.16;
  const eyeY = bodyTop + bodyH * 0.40, eyeDx = bodyW * 0.21;
  const legY = bodyTop + bodyH - s * 0.01;
  const armY = bodyTop + bodyH * 0.60;
  const armDown = mood === "workout" ? s * 0.10 : s * 0.05;
  const ink = "var(--ink)";
  const arcEyes = mood === "happy" || mood === "proud" || mood === "workout";

  const legs = [-1, 1].map(d => `<line x1="${cx + d * bodyW * 0.20}" y1="${legY}"
      x2="${cx + d * bodyW * 0.26}" y2="${legY + s * 0.09}"
      stroke="${bodyColor}" stroke-width="${s * 0.055}" stroke-linecap="round"/>`).join("");

  const arms = [-1, 1].map(d => `<line x1="${cx + d * bodyW * 0.44}" y1="${armY}"
      x2="${cx + d * bodyW * 0.56}" y2="${armY + armDown}"
      stroke="${bodyColor}" stroke-width="${s * 0.048}" stroke-linecap="round"/>`).join("");

  const eyes = arcEyes
    ? [-1, 1].map(d => `<path d="M ${cx + d * eyeDx - s * 0.052} ${eyeY + s * 0.012}
         q ${s * 0.052} ${-s * 0.055} ${s * 0.104} 0"
         fill="none" stroke="${ink}" stroke-width="${s * 0.032}" stroke-linecap="round"/>`).join("")
    : [-1, 1].map(d => `<circle cx="${cx + d * eyeDx}" cy="${eyeY}" r="${s * 0.030}" fill="${ink}"/>`
        + (mood === "worried"
          ? `<line x1="${cx + d * eyeDx - d * s * 0.045}" y1="${eyeY - s * 0.085}"
               x2="${cx + d * eyeDx + d * s * 0.030}" y2="${eyeY - s * 0.055}"
               stroke="${ink}" stroke-width="${s * 0.024}" stroke-linecap="round"/>` : "")).join("");

  const blush = [-1, 1].map(d => `<ellipse cx="${cx + d * bodyW * 0.32}" cy="${eyeY + s * 0.072}"
      rx="${s * 0.045}" ry="${s * 0.028}" fill="var(--coral)" opacity=".38"/>`).join("");

  const mouthY = eyeY + s * 0.10;
  const mouth = mood === "worried"
    ? `<path d="M ${cx - s * 0.045} ${mouthY + s * 0.055} q ${s * 0.045} ${-s * 0.05} ${s * 0.09} 0"
         fill="none" stroke="${ink}" stroke-width="${s * 0.026}" stroke-linecap="round"/>`
    : `<path d="M ${cx - s * 0.05} ${mouthY} q ${s * 0.05} ${s * 0.055} ${s * 0.10} 0"
         fill="none" stroke="${ink}" stroke-width="${s * 0.026}" stroke-linecap="round"/>`;

  let prop = "";
  if (mood === "worried") {
    const x = cx + bodyW * 0.46, y = bodyTop + bodyH * 0.16, r = s * 0.042;
    prop = `<path d="M ${x} ${y - r * 1.7} C ${x + r * 1.2} ${y - r * 0.2}, ${x + r} ${y + r}, ${x} ${y + r}
              C ${x - r} ${y + r}, ${x - r * 1.2} ${y - r * 0.2}, ${x} ${y - r * 1.7} Z" fill="#6EC6FF"/>`;
  } else if (mood === "proud") {
    const star = (x, y, r) => `<path d="M ${x} ${y - r} Q ${x + r * 0.18} ${y - r * 0.18} ${x + r} ${y}
        Q ${x + r * 0.18} ${y + r * 0.18} ${x} ${y + r} Q ${x - r * 0.18} ${y + r * 0.18} ${x - r} ${y}
        Q ${x - r * 0.18} ${y - r * 0.18} ${x} ${y - r} Z" fill="var(--amber)"/>`;
    prop = star(cx + bodyW * 0.52, bodyTop + bodyH * 0.10, s * 0.075)
         + star(cx - bodyW * 0.55, bodyTop + bodyH * 0.30, s * 0.050);
  } else if (mood === "searching") {
    const x = cx + bodyW * 0.50, y = bodyTop + bodyH * 0.62, r = s * 0.085;
    prop = `<g transform="rotate(20 ${x} ${y})">
        <line x1="${x + r * 0.7}" y1="${y + r * 0.7}" x2="${x + r * 1.9}" y2="${y + r * 1.9}"
          stroke="${ink}" stroke-width="${s * 0.030}" stroke-linecap="round"/>
        <circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity=".85"/>
        <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${ink}" stroke-width="${s * 0.026}"/>
      </g>`;
  } else if (mood === "workout") {
    const y = armY + s * 0.10, half = bodyW * 0.56, pw = s * 0.075, ph = s * 0.165;
    prop = `<line x1="${cx - half}" y1="${y}" x2="${cx + half}" y2="${y}"
        stroke="${ink}" stroke-width="${s * 0.034}" stroke-linecap="round"/>`
      + [-1, 1].map(d => `<rect x="${cx + d * half - pw / 2}" y="${y - ph / 2}"
          width="${pw}" height="${ph}" rx="${s * 0.026}" fill="${ink}"/>`).join("");
  }

  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="flex:none">
    <ellipse cx="${cx}" cy="${bodyTop + bodyH + s * 0.045}" rx="${bodyW * 0.40}" ry="${s * 0.028}"
      fill="#000" opacity=".07"/>
    ${legs}${arms}
    <ellipse cx="${cx}" cy="${bodyTop + bodyH / 2}" rx="${bodyW / 2}" ry="${bodyH / 2}" fill="${bodyColor}"/>
    <ellipse cx="${cx}" cy="${bodyTop + bodyH * 0.62}" rx="${bodyW * 0.26}" ry="${bodyH * 0.20}"
      fill="#fff" opacity=".22"/>
    ${eyes}${blush}${mouth}${prop}
  </svg>`;
}

/** 종합 점수로 표정을 고른다. 앱의 moodOfScore와 같은 기준. */
const moodOfScore = score => score >= 70 ? "proud" : score >= 55 ? "happy" : "worried";

/**
 * 측정 입력 진행에 반응하는 코치. 앱의 CoachRow와 문구·표정 기준이 같다.
 * 8칸을 다 채울 때까지 이탈하지 않도록 남은 개수를 알려 준다.
 */
function coachRow(done, total){
  const left = total - done;
  const mood = done === 0 ? "happy" : left === 0 ? "proud" : "workout";
  const message =
    done === 0 ? "측정값 8가지만 넣으면 바로 진단해 드릴게요."
    : left === 0 ? "다 채우셨어요. 이제 진단해 볼까요?"
    : left <= 2 ? `${left}개만 더요. 거의 다 왔어요!`
    : `${done}개 입력하셨어요. ${left}개 남았습니다.`;
  return `<div class="coach">
    ${mascot(mood, 72)}
    <div class="bubble ${left === 0 ? "done" : ""}">${esc(message)}</div>
  </div>`;
}

/**
 * 퇴근길 지도 SVG. 앱의 MapScreen과 같은 투영·겹침 해소 규칙을 쓴다.
 * 서울 정도 범위에서는 경도에 cos(위도)만 곱하면 왜곡이 눈에 띄지 않는다.
 */
function mapSvg(courses, s, selectedId, W = 372, H = 400){
  const KM_PER_DEG = 111.32, PAD = 40;
  const pts = [[s.workLat, s.workLng], [s.homeLat, s.homeLng],
               ...courses.map(c => [c.lat, c.lng])];
  const meanLat = pts.reduce((a, p) => a + p[0], 0) / pts.length;
  const cosLat = Math.cos(meanLat * Math.PI / 180);

  const xs = pts.map(p => p[1] * cosLat), ys = pts.map(p => -p[0]);
  let minX = Math.min(...xs), maxX = Math.max(...xs);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  const MIN_SPAN = 0.004;
  if (maxX - minX < MIN_SPAN){ const c = (maxX + minX) / 2; minX = c - MIN_SPAN / 2; maxX = c + MIN_SPAN / 2; }
  if (maxY - minY < MIN_SPAN){ const c = (maxY + minY) / 2; minY = c - MIN_SPAN / 2; maxY = c + MIN_SPAN / 2; }

  const scale = Math.min((W - PAD * 2) / (maxX - minX), (H - PAD * 2) / (maxY - minY));
  const offX = PAD + ((W - PAD * 2) - (maxX - minX) * scale) / 2;
  const offY = PAD + ((H - PAD * 2) - (maxY - minY) * scale) / 2;
  const at = (lat, lng) => [offX + (lng * cosLat - minX) * scale, offY + (-lat - minY) * scale];
  const kmPx = km => km / KM_PER_DEG * scale;

  const work = at(s.workLat, s.workLng), home = at(s.homeLat, s.homeLng);

  // 같은 시설의 강좌는 좌표가 같아 그대로 두면 하나만 보인다. 서로 밀어낸다.
  const GAP = 34, PIN_GAP = 52, MARGIN = 22;
  const pos = courses.map(c => at(c.lat, c.lng));
  for (let k = 0; k < 80; k++){
    for (let i = 0; i < pos.length; i++){
      for (let j = i + 1; j < pos.length; j++){
        let dx = pos[j][0] - pos[i][0], dy = pos[j][1] - pos[i][1];
        let d = Math.hypot(dx, dy);
        if (d >= GAP) continue;
        if (d < 0.01){ const a = i * 2.399963; dx = Math.cos(a); dy = Math.sin(a); d = 1; }
        const push = (GAP - d) / 2, ux = dx / d, uy = dy / d;
        pos[i][0] -= ux * push; pos[i][1] -= uy * push;
        pos[j][0] += ux * push; pos[j][1] += uy * push;
      }
      for (const f of [work, home]){
        let dx = pos[i][0] - f[0], dy = pos[i][1] - f[1];
        let d = Math.hypot(dx, dy);
        if (d >= PIN_GAP) continue;
        if (d < 0.01){ dx = 0; dy = 1; d = 1; }
        pos[i][0] = f[0] + dx / d * PIN_GAP;
        pos[i][1] = f[1] + dy / d * PIN_GAP;
      }
      pos[i][0] = Math.min(Math.max(pos[i][0], MARGIN), W - MARGIN);
      pos[i][1] = Math.min(Math.max(pos[i][1], MARGIN), H - MARGIN);
    }
  }

  let grid = "";
  for (let x = 0; x < W; x += 44) grid += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#E2E9E7"/>`;
  for (let y = 0; y < H; y += 44) grid += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#E2E9E7"/>`;

  const markers = courses.map((c, i) => {
    const on = c.course_id === selectedId, [x, y] = pos[i], r = on ? 19 : 14;
    return `<g class="map-marker" onclick="selectMarker('${esc(c.course_id)}')">
      ${on ? `<circle cx="${x}" cy="${y}" r="${r + 9}" fill="var(--mint)" opacity=".25"/>` : ""}
      <circle cx="${x}" cy="${y}" r="${r + 2.5}" fill="#fff"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${on ? "var(--mint-deep)" : "var(--mint)"}"/>
      <text x="${x}" y="${y + (on ? 5 : 4)}" text-anchor="middle" font-family="inherit"
        font-size="${on ? 14 : 11}" font-weight="800" fill="#04120D">${i + 1}</text>
    </g>`;
  }).join("");

  const pin = ([x, y], label) => {
    const w = label.length * 12 + 18, h = 24, top = y - h - 10;
    return `<circle cx="${x}" cy="${y}" r="7" fill="#fff"/>
      <circle cx="${x}" cy="${y}" r="4.5" fill="var(--ink)"/>
      <rect x="${x - w / 2}" y="${top}" width="${w}" height="${h}" rx="${h / 2}" fill="var(--ink)"/>
      <text x="${x}" y="${top + 16}" text-anchor="middle" font-family="inherit"
        font-size="11" font-weight="700" fill="#fff">${esc(label)}</text>`;
  };

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${grid}
    <line x1="${work[0]}" y1="${work[1]}" x2="${home[0]}" y2="${home[1]}"
      stroke="var(--mint)" stroke-opacity=".13"
      stroke-width="${kmPx(s.maxDistanceKm) * 2}" stroke-linecap="round"/>
    <line x1="${work[0]}" y1="${work[1]}" x2="${home[0]}" y2="${home[1]}"
      stroke="var(--mint-deep)" stroke-opacity=".55" stroke-width="2.5"
      stroke-linecap="round" stroke-dasharray="10 7"/>
    ${markers}
    ${pin(work, "직장")}${pin(home, "집")}
  </svg>`;
}

/** 종합 점수 링 (다크 히어로 위에 얹는다) */
function scoreRing(score, size = 78){
  const sw = 7, r = (size - sw) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
            style="transform:rotate(-90deg);flex:none">
    <defs><linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12F0A3"/><stop offset="100%" stop-color="#00A874"/>
    </linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
            stroke="rgba(255,255,255,.13)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#ringG)"
            stroke-width="${sw}" stroke-linecap="round"
            stroke-dasharray="${c}" stroke-dashoffset="${off}"
            style="transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)"/>
  </svg>`;
}

/**
 * 체력 4요인 레이더 차트. 불균형이 한눈에 보이도록 약점 축은 붉게 강조한다.
 * factors: [{factor, label, percentile}], weak: [factor]
 */
function radarChart(factors, weak, size = 236){
  const cx = size/2, cy = size/2 + 4, R = size/2 - 46, n = factors.length;
  const ang = i => (Math.PI * 2 * i / n) - Math.PI / 2;
  const at = (i, t) => [cx + Math.cos(ang(i)) * R * t, cy + Math.sin(ang(i)) * R * t];
  const poly = t => factors.map((_, i) => at(i, t).map(v => v.toFixed(1)).join(",")).join(" ");

  const grid = [0.25, 0.5, 0.75, 1].map(t =>
    `<polygon points="${poly(t)}" fill="none" stroke="#E3EAE8" stroke-width="1"/>`).join("");

  const axes = factors.map((_, i) => {
    const [x, y] = at(i, 1);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
              stroke="#E3EAE8" stroke-width="1"/>`;
  }).join("");

  const shape = factors.map((f, i) =>
    at(i, Math.max(0.06, f.percentile / 100)).map(v => v.toFixed(1)).join(",")).join(" ");

  const dots = factors.map((f, i) => {
    const [x, y] = at(i, Math.max(0.06, f.percentile / 100));
    const isWeak = weak.includes(f.factor);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isWeak ? 5.5 : 4}"
              fill="${isWeak ? "var(--coral)" : "var(--mint-deep)"}"
              stroke="#fff" stroke-width="2.5"/>`;
  }).join("");

  const labels = factors.map((f, i) => {
    const [x, y] = at(i, 1.28);
    const isWeak = weak.includes(f.factor);
    // 네 축 모두 가운데 정렬. start/end로 두면 좌우 축 라벨이 SVG 밖으로 잘린다.
    return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle"
              font-size="11" font-weight="${isWeak ? 750 : 600}"
              fill="${isWeak ? "var(--coral)" : "var(--muted)"}"
              font-family="inherit">${esc(f.label)}</text>
            <text x="${x.toFixed(1)}" y="${(y + 17).toFixed(1)}" text-anchor="middle"
              font-size="10.5" font-weight="700"
              fill="${isWeak ? "var(--coral)" : "var(--muted-2)"}"
              font-family="inherit">${100 - f.percentile}등</text>`;
  }).join("");

  return `<svg width="${size}" height="${size + 8}" viewBox="0 0 ${size} ${size + 8}">
    <defs><linearGradient id="radG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(0,214,143,.34)"/>
      <stop offset="100%" stop-color="rgba(0,168,116,.16)"/>
    </linearGradient></defs>
    ${grid}${axes}
    <polygon points="${shape}" fill="url(#radG)" stroke="var(--mint-deep)"
             stroke-width="2" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

function factorBar(f, weak){

}

// ---------------------------------------------------------------- 통신

function fieldError(f){
  const raw = state.form[f.k];
  if (raw === "") return null;
  const v = Number(raw);
  if (raw.trim() === "" || Number.isNaN(v)) return "숫자만 입력해 주세요";
  if (v < f.min || v > f.max) return `${f.min}~${f.max}${f.unit} 범위로 입력해 주세요`;
  return null;
}
const filledCount = () => FIELDS.filter(f => state.form[f.k] !== "" && !fieldError(f)).length;
const formValid = () => filledCount() === FIELDS.length;

async function call(path, options){
  state.loading = true; state.error = null; render();
  try {
    const res = await fetch(API + path, options);
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail ? JSON.stringify(body.detail) : `HTTP ${res.status}`);
    return body;
  } catch (e) {
    state.error = "서버 요청 실패 · " + e.message;
    return null;
  } finally { state.loading = false; }
}
const post = (path, body) => call(path, {
  method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
});

async function submitDiagnose(){
  const n = k => Number(state.form[k]);
  const r = await post("/api/v1/diagnose", {
    device_id:deviceId, gender:state.gender, age:n("age"),
    height_cm:n("height"), weight_kg:n("weight"), grip_kg:n("grip"),
    sit_up:n("situp"), sit_reach_cm:n("sitreach"),
    shuttle_run:n("shuttle"), standing_jump_cm:n("jump"),
  });
  if (r) { state.diagnosis = r; state.screen = "report"; window.scrollTo(0,0); }
  render();
}

async function loadCenters(){
  state.screen = "centers"; window.scrollTo(0,0); render();
  // 설정한 직장 지역의 시도를 앞세운다
  const hit = PRESETS.find(([, la, ln]) =>
    Math.abs(la - state.settings.workLat) < 0.0005 &&
    Math.abs(ln - state.settings.workLng) < 0.0005);
  const sido = hit ? (hit[3].startsWith("서울") ? "서울" : hit[3].startsWith("경기") ? "경기" : "") : "";
  const r = await call("/api/v1/centers" + (sido ? `?sido=${encodeURIComponent(sido)}` : ""));
  if (r) state.centers = r;
  render();
}

async function submitSelfCheck(){
  const r = await post("/api/v1/selfcheck", {
    device_id:deviceId, gender:state.gender, age:Number(state.selfAge),
    strength:state.selfAnswers.strength, endurance:state.selfAnswers.endurance,
    flex:state.selfAnswers.flex, cardio:state.selfAnswers.cardio,
    power:state.selfAnswers.power, activity:state.selfAnswers.activity,
  });
  if (r) { state.diagnosis = r; state.screen = "report"; window.scrollTo(0,0); }
  render();
}

async function loadRecommend(){
  const s = state.settings;
  state.screen = "recommend"; window.scrollTo(0,0); render();
  const r = await post("/api/v1/recommend", {
    device_id:deviceId,
    diagnosis_id: state.diagnosis ? state.diagnosis.diagnosis_id : null,
    weak_factors: state.diagnosis ? null : ["flex","power"],
    work_lat:s.workLat, work_lng:s.workLng, home_lat:s.homeLat, home_lng:s.homeLng,
    leave_time:s.leaveTime, max_distance_km:s.maxDistanceKm, limit:10,
  });
  if (r) state.recommend = r;
  render();
}

async function openCourse(id){
  state.screen = "course"; state.course = null; window.scrollTo(0,0); render();
  const r = await call("/api/v1/courses/" + id);
  if (r) state.course = r;
  render();
}

        </div>
        <div class="score">${Math.round(sel.score * 100)}</div>
      </div>
      <div class="when">${esc(sel.weekday)} ${esc(sel.start_time)} · 동선에서 ${sel.distance_km}km</div>
      <button class="btn primary" onclick="openCourse('${esc(sel.course_id)}')">이 강좌 자세히 보기</button>
    </div>
    <div class="btn-stack">
      <button class="btn ghost" onclick="go('recommend')">목록으로</button>
    </div>`;
}

function screenCourse(){
  const c = state.course;
  if (!c) return loadingBox("강좌 정보를 가져오는 중...", "searching");
  const tags = Object.entries(c.tags).filter(([,v]) => v === 1)
                     .map(([k]) => `<span class="chip">${FACTOR_LABEL[k]}</span>`).join("");
  return `
    <div class="hero">
      <div class="label">${esc(c.facility)}</div>
      <h3>${esc(c.title)}</h3>
      ${c.address ? `<p style="margin-top:6px">${esc(c.address)}</p>` : ""}
      <div class="meta">${esc(c.weekday)}요일 ${esc(c.start_time)} 시작 · ${esc(c.sport)}</div>
    </div>

    <div class="section-h">이 강좌가 키우는 체력요인</div>
    <div class="chips" style="margin-bottom:18px">${tags}</div>

    <div class="card">
      <div class="kv"><span class="k">일정</span><span class="v">${esc(c.weekday)}요일 ${esc(c.start_time)}</span></div>
      <div class="kv"><span class="k">시설</span><span class="v">${esc(c.facility)}</span></div>
      <div class="kv"><span class="k">종목</span><span class="v">${esc(c.sport)}</span></div>
      ${c.address ? `<div class="kv"><span class="k">주소</span><span class="v">${esc(c.address)}</span></div>` : ""}
    </div>

    <div class="btn-stack">
      <button class="btn dark" onclick="window.open('${esc(c.apply_url)}','_blank')">신청 페이지 열기</button>
      <div class="msg" style="text-align:center;margin-top:9px">
        앱 안에서 예약되지 않고, 해당 시설의 신청 페이지로 이동합니다.</div>
      <button class="btn ghost" style="margin-top:14px" onclick="go('recommend')">목록으로</button>
    </div>`;
}

function screenSettings(){
  const s = state.settings;
  const presetRow = which => `<div class="chips">` + PRESETS.map(([name, lat, lng]) => {
    const on = Math.abs(s[which + "Lat"] - lat) < 0.0005 && Math.abs(s[which + "Lng"] - lng) < 0.0005;
    return `<span class="chip pick ${on ? "on" : ""}"
              onclick="pickPlace('${which}',${lat},${lng})">${name}</span>`;
  }).join("") + `</div>`;

  return `
    <div class="eyebrow">설정</div>
    <h2 class="title" style="font-size:21px;margin:0 0 16px">추천 조건</h2>

    <div class="card">
      <div class="field" style="margin-top:0">
        <label><span>직장 위치</span></label>
        ${presetRow("work")}
        <div class="msg">${esc(addressOf(s.workLat, s.workLng))}</div>
      </div>
      <div class="field">
        <label><span>집 위치</span></label>
        ${presetRow("home")}
        <div class="msg">${esc(addressOf(s.homeLat, s.homeLng))}</div>
      </div>
      <div class="field">
        <label><span>퇴근 시각</span><span class="unit">HH:MM</span></label>
        <input value="${esc(s.leaveTime)}" oninput="setSetting('leaveTime', this.value)">
        <div class="msg">이 시각 30분 뒤부터 시작하는 강좌를 찾습니다</div>
      </div>
      <div class="field">
        <label><span>퇴근 동선에서 최대 거리</span>
          <span class="unit" style="color:var(--mint-deep);font-weight:750">${s.maxDistanceKm.toFixed(1)}km</span></label>
        <input class="range" type="range" min="0.5" max="10" step="0.5" value="${s.maxDistanceKm}"
               oninput="setSetting('maxDistanceKm', Number(this.value))">
        <div class="msg">직장과 집을 잇는 직선에서 이 거리 안의 강좌만 추천합니다</div>
      </div>
    </div>

    <div class="card flat">
      <div class="item-name" style="margin-bottom:8px">기기 정보</div>
      <div class="msg" style="margin:0 0 3px">기기 UUID</div>
      <div class="mono">${esc(deviceId)}</div>
    </div>

    <div class="btn-stack">
      <button class="btn primary" onclick="saveSettings()">저장</button>
      <button class="btn ghost" onclick="go('home')">홈으로</button>
    </div>`;
}

// ---------------------------------------------------------------- 액션

function setGender(g){ state.gender = g; render(); }
function setField(k, v){ state.form[k] = v; render(); }
function fillSample(){ FIELDS.forEach(f => state.form[f.k] = f.sample); render(); }
function pickPlace(which, lat, lng){
  state.settings[which + "Lat"] = lat; state.settings[which + "Lng"] = lng; render();
}
function setSetting(k, v){ state.settings[k] = v; render(); }
function setSelfAge(v){ state.selfAge = v; render(); }
function setSelfAnswer(k, score){ state.selfAnswers[k] = score; render(); }
function saveSettings(){
  localStorage.setItem("settings", JSON.stringify(state.settings));
  if (state.diagnosis) loadRecommend(); else go("home");
}

const SCREENS = {
  home:screenHome, measure:screenMeasure, report:screenReport,
  selfcheck:screenSelfCheck, centers:screenCenters, recommend:screenRecommend, map:screenMap,
  course:screenCourse, settings:screenSettings,
};

/** 지도 마커 선택. 하단 카드가 함께 바뀐다. */
function selectMarker(courseId){ state.mapSelected = courseId; render(); }

/**
 * 화면 전체를 다시 그린다.
 * 매 입력마다 다시 그리므로, 편집 중이던 입력 칸의 포커스와 커서 위치를 되살린다.
 */
function render(){
  const active = document.activeElement;
  const fk = active && active.dataset ? active.dataset.fk : null;
  const caret = fk ? active.selectionStart : null;

  let html = "";
  if (state.error) html += `<div class="toast">${esc(state.error)}</div>`;
  html += SCREENS[state.screen]();
  app.innerHTML = html;

  if (fk){
    const next = app.querySelector(`input[data-fk="${fk}"]`);
    if (next){
      next.focus();
      try { next.setSelectionRange(caret, caret); } catch(e){ /* range 미지원 타입 무시 */ }
    }
  }
}

render();
</script>
</body>
</html>
